<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient></defs><rect width="1200" height="330" rx="24" fill="url(#bg)"/><text x="40" y="48" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#fde68a">How it was built</text><g><rect x="40" y="80" width="220" height="90" rx="16" fill="#f472b6"><animate attributeName="opacity" values=".8;1;.8" dur="3s" repeatCount="indefinite"/></rect><text x="150.0" y="114" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0b1020">Team dataset</text><text x="150.0" y="156" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1e1b4b">9,380 rows</text></g><g><rect x="40" y="200" width="220" height="90" rx="16" fill="#fbbf24"><animate attributeName="opacity" values=".8;1;.8" dur="4s" repeatCount="indefinite"/></rect><text x="150.0" y="234" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0b1020">11 public datasets</text><text x="150.0" y="276" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1e1b4b">8,250 rows</text></g><g><rect x="330" y="130" width="210" height="110" rx="16" fill="#a78bfa"><animate attributeName="opacity" values=".8;1;.8" dur="5s" repeatCount="indefinite"/></rect><text x="435.0" y="164" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0b1020">Map to the</text><text x="435.0" y="188" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0b1020">500 coordinates</text><text x="435.0" y="226" text-anchor="middle" font-family="Inter,Segoe UI,H